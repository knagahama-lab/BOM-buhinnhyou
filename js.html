<script>
// ============================================================
// js.html — 製品図鑑・マニュアル管理 フロントエンド
// 見積管理システム(mitumorikannri-VR3)と同系統のサイドバー/カードUIパターンを踏襲
// ============================================================

const MENU = [
  { id:'model',    icon:'🏭', label:'機種図鑑',     section:'製品図鑑' },
  { id:'board',    icon:'🔌', label:'基板図鑑',     section:'製品図鑑' },
  { id:'manual',   icon:'📚', label:'マニュアル管理', section:'ナレッジ' },
  { id:'flow',     icon:'🔄', label:'フロー管理',   section:'ナレッジ' },
  { id:'analysis', icon:'📊', label:'分析',        section:'分析' },
  { id:'settings', icon:'⚙️', label:'設定・使い方', section:'その他' }
];
const PAGE_TITLES = { model:'機種図鑑', board:'基板図鑑', manual:'マニュアル管理', flow:'フロー管理', analysis:'分析', settings:'設定・使い方' };
const TOPBAR_ACTIONS = {
  model:    '<button class="topbar-btn primary" onclick="openModelEditModal(null)">＋ 機種を登録</button>',
  board:    '<button class="topbar-btn primary" onclick="openBoardEditModal(null)">＋ 基板を登録</button>',
  manual:   '<button class="topbar-btn primary" onclick="openManualEditModal(null)">＋ マニュアルを登録</button>',
  flow:     '<button class="topbar-btn primary" onclick="openFlowEditModal(null)">＋ フローを登録</button>',
  analysis: '',
  settings: ''
};

let DATA = { models:{}, boards:{}, manuals:{}, flows:{}, analysis:{} };
let _currentPage = 'model';

window.addEventListener('load', () => {
  renderSidebar();
  showPage('model');
  loadAll();
});

// ── ユーティリティ ──
function _esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// GoogleドライブのファイルURL（.../file/d/ID/view など）を<img src>で直接表示できる形式に変換する。
// 旧アップロード分（閲覧URLがそのまま保存されている）でも表示できるようにするための救済措置。
function _driveImgUrl(url){
  const s = String(url||''); if (!s) return s;
  const m = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? `https://drive.google.com/uc?export=view&id=${m[1]}` : s;
}
function _genId(prefix){ return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase(); }
function _now(){ return new Date().toISOString(); }
function showToast(msg, isError=false){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=(isError?'✗ ':'✓ ')+msg; t.style.background=isError?'#dc2626':'#1e293b';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3500);
}
function openModal(id){ const el=document.getElementById(id); if(el) el.classList.add('open'); }
function closeModal(id){ const el=document.getElementById(id); if(el) el.classList.remove('open'); }
function _csv(str){ return String(str||'').split(',').map(s=>s.trim()).filter(Boolean); }
function _uniqSorted(arr){ return Array.from(new Set(arr.filter(Boolean))).sort(); }
function _fillSelect(selectEl, values, placeholder){
  if(!selectEl) return;
  const cur = selectEl.value;
  selectEl.innerHTML = `<option value="">${placeholder}</option>` + values.map(v=>`<option value="${_esc(v)}">${_esc(v)}</option>`).join('');
  selectEl.value = cur;
}
function _fillDatalist(id, values){
  const dl = document.getElementById(id); if(!dl) return;
  dl.innerHTML = values.map(v=>`<option value="${_esc(v)}">`).join('');
}
// フローのステップ（JSON配列）をパース。旧形式（改行区切りの自由テキスト）や壊れたJSONはフォールバックで1ステップずつに変換
function _parseSteps(stepsStr){
  const s = String(stepsStr||'').trim();
  if (!s) return [];
  try {
    const arr = JSON.parse(s);
    if (Array.isArray(arr)) return arr;
  } catch(e) { /* フォールバックへ */ }
  return s.split('\n').map(line=>line.trim()).filter(Boolean).map((line,i) => ({
    no:String(i+1), type:'step', title:line, detail:'', owner:'',
    branchYes:'', branchNo:'', nextNo:'', manualIds:'', refLink:'', note:'', done:false
  }));
}
function _stepsToJson(steps){ return JSON.stringify(steps||[]); }
// 汎用: JSON配列文字列をパース（壊れていれば空配列）
function _parseJsonArray(str){
  const s = String(str||'').trim();
  if (!s) return [];
  try { const arr = JSON.parse(s); return Array.isArray(arr) ? arr : []; } catch(e) { return []; }
}

// ── サイドバー / ページ切替 ──
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed'); }
function renderSidebar(){
  const container = document.getElementById('sidebar-nav-container'); if(!container) return;
  const sections = {};
  MENU.forEach(item=>{ if(!sections[item.section]) sections[item.section]=[]; sections[item.section].push(item); });
  let html='';
  Object.keys(sections).forEach(section=>{
    html += `<div class="sidebar-section-label">${section}</div>`;
    sections[section].forEach(item=>{
      html += `<div class="nav-item" data-id="${item.id}" onclick="showPage('${item.id}')"><span class="nav-item-icon">${item.icon}</span><span class="nav-item-label">${item.label}</span></div>`;
    });
  });
  container.innerHTML = html;
}
function showPage(name){
  _currentPage = name;
  document.querySelectorAll('.nav-item[data-id]').forEach(t=>{ t.classList.toggle('active', t.dataset.id===name); });
  const titleEl = document.getElementById('topbar-page-title'); if(titleEl) titleEl.textContent = PAGE_TITLES[name] || name;
  const actionsEl = document.getElementById('topbar-actions'); if(actionsEl) actionsEl.innerHTML = TOPBAR_ACTIONS[name] || '';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const target = document.getElementById('page-'+name); if(target) target.classList.add('active');
  document.getElementById('content').scrollTop = 0;
}

// ── データ読み込み ──
function loadAll(){
  google.script.run.withSuccessHandler(res => {
    if (!res || !res.success) { showToast('データ取得に失敗しました: ' + (res&&res.error||''), true); return; }
    DATA.models = res.models || {};
    DATA.boards = res.boards || {};
    DATA.manuals = res.manuals || {};
    DATA.flows = res.flows || {};
    DATA.analysis = res.analysis || {};
    renderModelGrid(); renderBoardGrid(); renderManualList(); renderFlowList(); renderAnalysisPage();
  }).withFailureHandler(err => showToast('通信エラー: ' + (err.message||err), true))
    .apiLoadAll();
}

// ── ファイルアップロード共通処理 ──
function uploadToField(inputEl, targetFieldId){
  const f = inputEl.files[0]; if(!f) return;
  const statusId = targetFieldId.replace('-url','-status');
  const statusEl = document.getElementById(statusId);
  if (statusEl) statusEl.textContent = '⏳ アップロード中...';
  const reader = new FileReader();
  reader.onload = e => {
    const b64 = e.target.result.split(',')[1];
    google.script.run.withSuccessHandler(res => {
      if (res && res.success) {
        // 写真URL欄は<img>で直接表示するのでdirectUrl（Drive直接表示形式）を使う
        const isPhoto = /photo-url$/.test(targetFieldId);
        document.getElementById(targetFieldId).value = (isPhoto && res.directUrl) ? res.directUrl : res.url;
        if (statusEl) statusEl.innerHTML = '<span style="color:var(--success);">✅ アップロード完了</span>';
        showToast('アップロードしました');
      } else {
        if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger);">❌ ' + ((res&&res.error)||'失敗') + '</span>';
      }
    }).withFailureHandler(err => {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger);">❌ 通信エラー</span>';
    }).apiUploadFile({ base64Data: b64, fileName: f.name, mimeType: f.type });
  };
  reader.readAsDataURL(f);
  inputEl.value = '';
}

// ════════════════════════════════════════════════════════════
// テンプレート（雛形）
// ════════════════════════════════════════════════════════════
let _templateInfo = null;
function _withTemplateInfo(cb){
  if (_templateInfo) { cb(_templateInfo); return; }
  showToast('雛形を準備しています...');
  google.script.run.withSuccessHandler(res => {
    if (!res || !res.success) { showToast('雛形の取得に失敗しました: ' + (res&&res.error||''), true); return; }
    delete res.success;
    _templateInfo = res;
    cb(_templateInfo);
  }).withFailureHandler(err => showToast('通信エラー: ' + (err.message||err), true))
    .apiGetTemplateInfo();
}
function downloadTemplate(kind){
  _withTemplateInfo(info => {
    const t = info[kind]; if (!t) { showToast('テンプレートが見つかりません', true); return; }
    window.open(t.downloadUrl, '_blank');
  });
}
function copyTemplateAndOpen(kind){
  google.script.run.withSuccessHandler(res => {
    if (res && res.success) { showToast('雛形をコピーしました'); window.open(res.url, '_blank'); }
    else showToast('コピー失敗: ' + (res&&res.error||''), true);
  }).withFailureHandler(err => showToast('通信エラー: ' + (err.message||err), true))
    .apiCopyTemplate({ kind });
}
function copyTemplateAndCreateManual(kind){
  google.script.run.withSuccessHandler(res => {
    if (res && res.success) {
      showToast('雛形をコピーしました。続けて内容を編集してください');
      window.open(res.url, '_blank');
      openManualEditModal(null);
      document.getElementById('manual-title').value = res.name.replace(/_\d{8}_\d{4}$/, '');
      document.getElementById('manual-file-url').value = res.url;
    } else showToast('コピー失敗: ' + (res&&res.error||''), true);
  }).withFailureHandler(err => showToast('通信エラー: ' + (err.message||err), true))
    .apiCopyTemplate({ kind });
}

// ── 機種・基板の一括取り込み（雛形スプレッドシートから） ──
function importModelsFromSheet(){
  const url = document.getElementById('model-import-sheet-url').value.trim();
  if (!url) { showToast('スプレッドシートのURLを入力してください', true); return; }
  const statusEl = document.getElementById('model-import-status');
  statusEl.innerHTML = '⏳ 取り込み中...';
  google.script.run.withSuccessHandler(res => {
    if (res && res.success) {
      res.models.forEach(m => { DATA.models[m.code] = Object.assign({ type:'', date:'', photoUrl:'', summary:'', features:'', studyNote:'', manualIds:'', note:'', updatedAt:_now() }, m); });
      google.script.run.withSuccessHandler(res2 => {
        if (res2.success) {
          statusEl.innerHTML = `<span style="color:var(--success);">✅ 「${_esc(res.sourceName)}」から${res.models.length}件を取り込みました</span>`;
          showToast('取り込みました'); document.getElementById('model-import-sheet-url').value=''; renderModelGrid();
        } else statusEl.innerHTML = '<span style="color:var(--danger);">❌ 保存失敗: ' + _esc(res2.error||'') + '</span>';
      }).withFailureHandler(() => { statusEl.innerHTML = '<span style="color:var(--danger);">❌ 通信エラー</span>'; })
        .apiSaveModels(DATA.models);
    } else statusEl.innerHTML = '<span style="color:var(--danger);">❌ ' + _esc((res&&res.error)||'取り込み失敗') + '</span>';
  }).withFailureHandler(() => { statusEl.innerHTML = '<span style="color:var(--danger);">❌ 通信エラー</span>'; })
    .apiImportModelsFromSheet({ sheetUrl: url });
}
function importBoardsFromSheet(){
  const url = document.getElementById('board-import-sheet-url').value.trim();
  if (!url) { showToast('スプレッドシートのURLを入力してください', true); return; }
  const statusEl = document.getElementById('board-import-status');
  statusEl.innerHTML = '⏳ 取り込み中...';
  google.script.run.withSuccessHandler(res => {
    if (res && res.success) {
      res.boards.forEach(b => { DATA.boards[b.id] = Object.assign({ version:'', status:'', photoUrl:'', summary:'', mainParts:'', studyPoint:'', relatedModels:'', note:'', updatedAt:_now() }, b); });
      google.script.run.withSuccessHandler(res2 => {
        if (res2.success) {
          statusEl.innerHTML = `<span style="color:var(--success);">✅ 「${_esc(res.sourceName)}」から${res.boards.length}件を取り込みました</span>`;
          showToast('取り込みました'); document.getElementById('board-import-sheet-url').value=''; renderBoardGrid();
        } else statusEl.innerHTML = '<span style="color:var(--danger);">❌ 保存失敗: ' + _esc(res2.error||'') + '</span>';
      }).withFailureHandler(() => { statusEl.innerHTML = '<span style="color:var(--danger);">❌ 通信エラー</span>'; })
        .apiSaveBoards(DATA.boards);
    } else statusEl.innerHTML = '<span style="color:var(--danger);">❌ ' + _esc((res&&res.error)||'取り込み失敗') + '</span>';
  }).withFailureHandler(() => { statusEl.innerHTML = '<span style="color:var(--danger);">❌ 通信エラー</span>'; })
    .apiImportBoardsFromSheet({ sheetUrl: url });
}

// ── 初期データ投入（部品マスタxlsx・機種別ハードウェア構成表PDFから抽出した実データ） ──
function seedRealData(){
  const statusEl = document.getElementById('seed-status');

      loadAll();

// ── 関連資料エディタ（機種図鑑） ──
const RELATED_DOC_CATEGORIES = [
  '構成表-見本機','構成表-量産',
  '弊社見積書-仕掛基板','弊社見積書-PCB','弊社見積書-組立見積書',
  '他社見積書-実装','他社見積書-組立',
  '組立基準書','生産計画書','納品計画書','部品表','その他'
];
let _editingRelatedDocs = [];
function renderRelatedDocEditor(){
  const el = document.getElementById('related-doc-editor-list'); if(!el) return;
  if (_editingRelatedDocs.length === 0) { el.innerHTML = `<div style="font-size:12px;color:var(--text-sub);padding:6px 0 10px;">関連資料がありません。「＋ 関連資料を追加」から登録してください。</div>`; return; }
  const opts = cat => RELATED_DOC_CATEGORIES.map(c=>`<option value="${_esc(c)}" ${c===cat?'selected':''}>${_esc(c)}</option>`).join('');
  el.innerHTML = _editingRelatedDocs.map((d,i) => `
    <div class="step-editor-row">
      <div class="step-editor-row-head">
        <select style="width:190px;" onchange="_editingRelatedDocs[${i}].category=this.value">${opts(d.category)}</select>
        <input type="text" value="${_esc(d.title)}" placeholder="タイトル（例: 量産構成表_v2）" style="flex:1;" onchange="_editingRelatedDocs[${i}].title=this.value">
        <button type="button" class="btn btn-danger btn-sm" onclick="removeRelatedDocRow(${i})">🗑</button>
      </div>
      <div class="step-editor-grid">
        <input type="text" value="${_esc(d.url)}" placeholder="URL（見積管理システムの見積書URL、Driveリンクなど）" onchange="_editingRelatedDocs[${i}].url=this.value">
        <input type="text" value="${_esc(d.note)}" placeholder="備考（見積No・版数など）" onchange="_editingRelatedDocs[${i}].note=this.value">
      </div>
    </div>`).join('');
}
function addRelatedDocRow(){ _editingRelatedDocs.push({category:RELATED_DOC_CATEGORIES[0],title:'',url:'',note:''}); renderRelatedDocEditor(); }
function removeRelatedDocRow(i){ _editingRelatedDocs.splice(i,1); renderRelatedDocEditor(); }

// ── 関連資料エディタ（基板図鑑） ──
const BOARD_DOC_CATEGORIES = [
  '見積書-PCB原価','見積書-仕掛原価','見積書-PCB公表単価','見積書-仕掛公表単価','見積書-過去見積',
  '部品表','基板仕様書','関連基板情報','その他'

  if (_editingBoardDocs.length === 0) { el.innerHTML = `<div style="font-size:12px;color:var(--text-sub);padding:6px 0 10px;">関連資料がありません。「＋ 関連資料を追加」から登録してください。</div>`; return; }

    <div class="step-editor-row">
      <div class="step-editor-row-head">

      <div class="step-editor-grid">

function addBoardDocRow(){ _editingBoardDocs.push({category:BOARD_DOC_CATEGORIES[0],title:'',url:'',note:''}); renderBoardDocEditor(); }
function removeBoardDocRow(i){ _editingBoardDocs.splice(i,1); renderBoardDocEditor(); }

// ════════════════════════════════════════════════════════════
// 機種図鑑
// ════════════════════════════════════════════════════════════
function _populateModelFilters(){
  const list = Object.values(DATA.models);
  _fillSelect(document.getElementById('model-filter-brand'), _uniqSorted(list.map(m=>m.brand)), 'すべてのブランド');
  _fillSelect(document.getElementById('model-filter-type'), _uniqSorted(list.map(m=>m.type)), 'すべての種類');
  _fillDatalist('model-brand-list', _uniqSorted(list.map(m=>m.brand)));
  _fillDatalist('model-type-list', _uniqSorted(list.map(m=>m.type)));
}
function _gameTypeBadge(gt){
  if (gt === 'パチンコ') return '<span class="badge badge-danger">パチンコ</span>';
  if (gt === '回胴') return '<span class="badge badge-info">回胴（スロット）</span>';
  if (gt === '共通') return '<span class="badge badge-default">パチンコ／回胴共通</span>';
  return '';
}
function renderModelGrid(){
  _populateModelFilters();
  const kw = (document.getElementById('model-search').value||'').toLowerCase();
  const fb = document.getElementById('model-filter-brand').value;
  const ft = document.getElementById('model-filter-type').value;
  const fg = document.getElementById('model-filter-gametype').value;
  const list = Object.values(DATA.models).filter(m => {
    const txt = [m.code,m.name,m.brand,m.type,m.features,m.summary].join(' ').toLowerCase();
    const mk = !kw || txt.includes(kw);
    const mb = !fb || m.brand === fb;
    const mt = !ft || m.type === ft;
    const mg = !fg || m.gameType === fg;
    return mk && mb && mt && mg;
  }).sort((a,b)=> String(a.code).localeCompare(String(b.code)));
  const grid = document.getElementById('model-grid');
  if (list.length === 0) { grid.innerHTML = `<div class="zukan-empty" style="grid-column:1/-1;"><div class="zukan-empty-icon">📭</div>該当する機種がありません</div>`; return; }
  grid.innerHTML = list.map(m => {
    const boards = ['m','d','de','e','c','s','r'].map(k=>m[k]).filter(Boolean);
    const photo = m.photoUrl ? `<img src="${_esc(_driveImgUrl(m.photoUrl))}" alt="">` : '🏭';
    return `<div class="zukan-card" onclick="openModelDetail('${_esc(m.code).replace(/'/g,"\\'")}')">
      <div class="zukan-card-photo">${photo}</div>
      <div class="zukan-card-body">
        <div class="zukan-card-title">${_esc(m.name || m.code)}</div>
        <div class="zukan-card-sub">${_esc(m.code)}${m.brand?' ・ '+_esc(m.brand):''}</div>
        <div class="zukan-card-tags">
          ${_gameTypeBadge(m.gameType)}
          ${m.type?`<span class="badge badge-default">${_esc(m.type)}</span>`:''}
          ${boards.length?`<span class="badge badge-default">基板${boards.length}種</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}
function openModelDetail(code){
  const m = DATA.models[code]; if(!m) return;
  document.getElementById('model-detail-title').textContent = '🏭 ' + (m.name || m.code);
  const boardRows = [['M基板',m.m],['D基板',m.d],['DE基板',m.de],['E基板',m.e],['C基板',m.c],['S基板',m.s],['R基板',m.r]].filter(([,v])=>v);
  const _boardCell = v => DATA.boards[v]
    ? `<a href="#" onclick="event.preventDefault();closeModal('model-detail-modal');openBoardDetail('${_esc(v).replace(/'/g,"\\'")}')">${_esc(v)} 🔗</a>`
    : _esc(v);

function _populateBoardFilters(){
  const list = Object.values(DATA.boards);
  _fillSelect(document.getElementById('board-filter-type'), _uniqSorted(list.map(b=>b.type)), 'すべての種類');
  _fillSelect(document.getElementById('board-filter-category'), _uniqSorted(list.map(b=>b.category)), 'すべての分類');
  _fillSelect(document.getElementById('board-filter-status'), _uniqSorted(list.map(b=>b.status)), 'すべてのステータス');
  _fillDatalist('board-type-list', _uniqSorted(list.map(b=>b.type)));
  _fillDatalist('board-category-list', _uniqSorted(list.map(b=>b.category)));
}
function renderBoardGrid(){
  _populateBoardFilters();
  const kw = (document.getElementById('board-search').value||'').toLowerCase();
  const ft = document.getElementById('board-filter-type').value;
  const fc = document.getElementById('board-filter-category').value;
  const fs = document.getElementById('board-filter-status').value;
  const fg = document.getElementById('board-filter-gametype').value;
  const sortKey = document.getElementById('board-sort').value;
  const list = Object.values(DATA.boards).filter(b => {
    const txt = [b.id,b.name,b.type,b.category,b.summary,b.mainParts].join(' ').toLowerCase();
    const mk = !kw || txt.includes(kw);
    const mt = !ft || b.type === ft;
    const mc = !fc || b.category === fc;
    const ms = !fs || b.status === fs;
    const mg = !fg || b.gameType === fg;
    return mk && mt && mc && ms && mg;
  }).sort((a,b) => {
    if (sortKey === 'id') return String(a.id).localeCompare(String(b.id));
    const av = String(a[sortKey]||''), bv = String(b[sortKey]||'');
    return av.localeCompare(bv) || String(a.id).localeCompare(String(b.id));
  });
  const grid = document.getElementById('board-grid');
  if (list.length === 0) { grid.innerHTML = `<div class="zukan-empty" style="grid-column:1/-1;"><div class="zukan-empty-icon">📭</div>該当する基板がありません</div>`; return; }
  const statusColor = { '量産中':'badge-success', '設計中':'badge-warning', '生産終了':'badge-default' };
  grid.innerHTML = list.map(b => {
    const photo = b.photoUrl ? `<img src="${_esc(_driveImgUrl(b.photoUrl))}" alt="">` : '🔌';
    return `<div class="zukan-card" onclick="openBoardDetail('${_esc(b.id).replace(/'/g,"\\'")}')">
      <div class="zukan-card-photo">${photo}</div>
      <div class="zukan-card-body">
        <div class="zukan-card-title">${_esc(b.name || b.id)}</div>
        <div class="zukan-card-sub">${_esc(b.id)}${b.brand?' ・ '+_esc(b.brand):''}${b.version?' ・ v'+_esc(b.version):''}</div>
        <div class="zukan-card-tags">
          ${_gameTypeBadge(b.gameType)}
          ${b.type?`<span class="badge badge-info">${_esc(b.type)}</span>`:''}
          ${b.category?`<span class="badge badge-default">${_esc(b.category)}</span>`:''}
          ${b.status?`<span class="badge ${statusColor[b.status]||'badge-default'}">${_esc(b.status)}</span>`:''}
          ${b.relatedModels?`<span class="badge badge-default">採用機種${_csv(b.relatedModels).length}件</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

// ── 達成率分析（機種図鑑の売上台数／売上目標から算出。専用データは持たない） ──
function renderAchievementTable(){
  const el = document.getElementById('achievement-table'); if(!el) return;
  const sortSel = document.getElementById('analysis-sort');
  const sortMode = sortSel ? sortSel.value : 'rateAsc';

  let list = Object.values(DATA.models).map(m => {
    const units = parseFloat(m.salesUnits) || 0;
    const target = parseFloat(m.salesTarget) || 0;
    const rate = target > 0 ? units / target : null;
    return { code:m.code, name:m.name, brand:m.brand, units, target, rate };
  });

  if (list.length === 0) {
    el.innerHTML = '<div style="padding:20px;color:var(--text-sub);font-size:12.5px;">機種データがありません。「機種図鑑」から売上台数・売上目標を登録してください。</div>';
    return;
  }

  list.sort((a,b) => {
    if (sortMode === 'salesDesc') return b.units - a.units;
    if (sortMode === 'rateDesc') return (b.rate==null?-1:b.rate) - (a.rate==null?-1:a.rate);
    const ar = a.rate==null ? Infinity : a.rate, br = b.rate==null ? Infinity : b.rate; // rateAsc: 目標未設定は末尾
    return ar - br;
  });

  el.innerHTML = `<table class="analysis-table"><thead><tr>
      <th>機種コード</th><th>機種名</th><th>ブランド</th><th>売上台数</th><th>売上目標</th><th>達成率</th>
    </tr></thead><tbody>${list.map(x => {
      const pct = x.rate == null ? null : Math.round(x.rate * 1000) / 10;
      const barColor = pct == null ? '#cbd5e1' : (pct >= 100 ? 'var(--success)' : pct >= 70 ? 'var(--warning)' : 'var(--danger)');
      const barWidth = pct == null ? 0 : Math.min(pct, 150) / 150 * 100;
      return `<tr>
        <td>${_esc(x.code)}</td><td>${_esc(x.name)}</td><td>${_esc(x.brand)}</td>
        <td>${x.units || '-'}</td><td>${x.target || '-'}</td>
        <td><div style="display:flex;align-items:center;gap:8px;">
          <div class="rate-bar-wrap"><div class="rate-bar" style="width:${barWidth}%;background:${barColor};"></div></div>
          <span style="font-size:11.5px;font-weight:700;min-width:76px;color:${pct==null?'var(--text-muted)':barColor};">${pct==null?'目標未設定':pct+'%'}</span>
        </div></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

    <div class="flow-detail-main-detail">${_esc(s.detail)||'（詳細は未記入です）'}</div>
    ${s.refLink?`<div style="margin-bottom:12px;"><a class="btn btn-outline btn-sm" href="${_esc(s.refLink)}" target="_blank">🔗 参考リンクを開く</a></div>`:''}
    ${manuals.length?`<div><div style="font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:6px;">📚 このステップのマニュアル</div><div class="flow-detail-manuals">${manuals.map(mn=>`<a class="btn btn-outline btn-sm" href="${_esc(mn.fileUrl)||'#'}" target="_blank">📄 ${_esc(mn.title)}</a>`).join('')}</div></div>`:''}
  `;
  document.getElementById('flow-step-note').value = s.note || '';
}
function toggleStepDone(checked){
  if (!_flowDetailSteps[_flowDetailStepIdx]) return;
  _flowDetailSteps[_flowDetailStepIdx].done = checked;
  _renderFlowRail();
  _persistFlowDetailSteps();
}
function saveStepNote(){
  if (!_flowDetailSteps[_flowDetailStepIdx]) return;
  _flowDetailSteps[_flowDetailStepIdx].note = document.getElementById('flow-step-note').value;
  _persistFlowDetailSteps();
}
function _persistFlowDetailSteps(){
  if (!_flowDetailId || !DATA.flows[_flowDetailId]) return;
  DATA.flows[_flowDetailId].steps = _stepsToJson(_flowDetailSteps);
  google.script.run.withSuccessHandler(res => {
    if (!res.success) showToast('保存失敗: ' + (res.error||''), true);
  }).withFailureHandler(err => showToast('通信エラー: ' + (err.message||err), true))
    .apiSaveFlows(DATA.flows);
}
function editFlowFromDetailPage(){ if (_flowDetailId) openFlowEditModal(_flowDetailId); }
function deleteFlowFromDetailPage(){
  if (!_flowDetailId) return;
  if (!confirm('このフローを削除しますか？')) return;
  const id = _flowDetailId;
  delete DATA.flows[id];
  google.script.run.withSuccessHandler(res => {
    if (res.success) { showToast('削除しました'); showPage('flow'); renderFlowList(); }
    else showToast('削除失敗: ' + (res.error||''), true);
  }).withFailureHandler(err => showToast('通信エラー: ' + (err.message||err), true))
    .apiSaveFlows(DATA.flows);
}
</script>

<style>
/* ============================================================
   CSS Variables & Reset
   （見積管理システム mitumorikannri-VR3 と同系統のデザイントークン）
============================================================ */
:root{
  --sidebar-w: 240px; --sidebar-collapsed-w: 60px; --sidebar-bg: #0f1729;
  --sidebar-hover: rgba(255,255,255,0.07); --sidebar-active: rgba(74,144,226,0.18);
  --sidebar-active-bar: #4a90e2; --sidebar-text: rgba(255,255,255,0.65);
  --sidebar-text-active: #fff; --sidebar-text-sub: rgba(255,255,255,0.35);
  --sidebar-border: rgba(255,255,255,0.06); --sidebar-logo-bg: #0a1020;
  --bg: #f4f6fb; --card: #ffffff; --border: #e8eaed; --border-light: #f0f2f5;
  --primary: #2563eb; --primary-light: #eff6ff; --primary-dark: #1d4ed8;
  --success: #16a34a; --danger: #dc2626; --warning: #d97706; --info: #0891b2;
  --text: #1e293b; --text-sub: #64748b; --text-muted: #94a3b8;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.14), 0 4px 10px rgba(0,0,0,.06);
  --radius: 10px; --radius-sm: 6px; --radius-lg: 14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;}
#app-shell{ display:flex; height:100vh; overflow:hidden; }

/* Sidebar */
#sidebar{ width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--sidebar-bg); display:flex; flex-direction:column; height:100vh; position:relative; transition:width .25s,min-width .25s; z-index:100; overflow:hidden; }
#sidebar.collapsed{ width:var(--sidebar-collapsed-w); min-width:var(--sidebar-collapsed-w); }
.sidebar-logo{ display:flex; align-items:center; gap:10px; padding:18px 16px 16px; border-bottom:1px solid var(--sidebar-border); background:var(--sidebar-logo-bg); flex-shrink:0; min-height:64px; cursor:pointer; user-select:none; }
.sidebar-logo-icon{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#4a90e2,#2563eb); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; box-shadow:0 2px 8px rgba(74,144,226,.4); }
.sidebar-logo-text{ display:flex; flex-direction:column; overflow:hidden; transition:opacity .2s,width .2s; white-space:nowrap; }
.sidebar-logo-title{ font-size:13px; font-weight:700; color:#fff; letter-spacing:0.02em; line-height:1.2; }
.sidebar-logo-sub{ font-size:10px; color:var(--sidebar-text-sub); margin-top:1px; }
#sidebar.collapsed .sidebar-logo-text{ opacity:0; width:0; overflow:hidden; }
.sidebar-nav{ flex:1; overflow-y:auto; overflow-x:hidden; padding:8px 0; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.1) transparent; }
.sidebar-section-label{ font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--sidebar-text-sub); padding:14px 18px 5px; white-space:nowrap; transition:opacity .2s; }
#sidebar.collapsed .sidebar-section-label{ opacity:0; pointer-events:none; }
.nav-item{ display:flex; align-items:center; gap:10px; padding:9px 14px 9px 16px; margin:1px 8px; border-radius:var(--radius-sm); cursor:pointer; color:var(--sidebar-text); font-size:12.5px; font-weight:500; transition:all .15s; text-decoration:none; position:relative; white-space:nowrap; user-select:none; }
.nav-item:hover{ background:var(--sidebar-hover); color:var(--sidebar-text-active); }
.nav-item.active{ background:var(--sidebar-active); color:var(--sidebar-text-active); }
.nav-item.active::before{ content:''; position:absolute; left:-8px; top:50%; transform:translateY(-50%); width:3px; height:20px; background:var(--sidebar-active-bar); border-radius:0 3px 3px 0; }
.nav-item-icon{ font-size:15px; width:20px; text-align:center; flex-shrink:0; line-height:1; }
.nav-item-label{ flex:1; transition:opacity .2s; overflow:hidden; }
#sidebar.collapsed .nav-item-label{ opacity:0; width:0; overflow:hidden; }
#sidebar.collapsed .nav-item{ justify-content:center; padding:9px; }
.sidebar-footer{ padding:12px 8px; border-top:1px solid var(--sidebar-border); flex-shrink:0; }
.sidebar-user{ display:flex; align-items:center; gap:10px; padding:8px; border-radius:var(--radius-sm); color:#fff;}
.sidebar-avatar{ width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#4a90e2,#7c3aed); display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; font-weight:700; flex-shrink:0; }
.sidebar-user-info{ overflow:hidden; flex:1; transition:opacity .2s; }
.sidebar-user-name{ font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-user-role{ font-size:10px; color:var(--sidebar-text-sub); }
#sidebar.collapsed .sidebar-user-info{ opacity:0; width:0; overflow:hidden; }
.sidebar-toggle{ position:absolute; top:20px; right:-12px; width:24px; height:24px; background:var(--card); border:1px solid var(--border); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-sub); box-shadow:var(--shadow-sm); z-index:101; transition:transform .25s; }
.sidebar-toggle:hover{ box-shadow:var(--shadow); color:var(--primary); }
#sidebar.collapsed .sidebar-toggle{ transform:rotate(180deg); }

/* Main & Topbar */
#main{ flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; min-width:0; }
#topbar{ height:56px; background:var(--card); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:16px; flex-shrink:0; position:sticky; top:0; z-index:50; }
.topbar-breadcrumb{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-sub); }
.topbar-breadcrumb-current{ font-size:14px; font-weight:700; color:var(--text); }
.topbar-breadcrumb-sep{ color:var(--border); }
.topbar-spacer{flex:1;}
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.topbar-btn{ height:32px; padding:0 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); color:var(--text); font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; font-family:inherit; }
.topbar-btn:hover{ background:var(--bg); border-color:#c5cdd9; }
.topbar-btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
.topbar-btn.primary:hover{ background:var(--primary-dark); }

/* Pages */
#content{ flex:1; overflow-y:auto; overflow-x:hidden; padding:24px; }
.page{display:none;max-width:1600px;margin:0 auto;}
.page.active{display:block;animation:fadeSlideIn .2s ease-out;}
@keyframes fadeSlideIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.page-heading{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
.page-heading h2{ font-size:18px; font-weight:700; }
.page-heading p{ font-size:12px; color:var(--text-sub); margin-top:3px; }

.summary-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:14px;margin-bottom:20px;}
.summary-card{ background:var(--card); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow-sm); border:1px solid var(--border-light); }
.summary-card .lbl{font-size:11px;color:var(--text-sub);margin-bottom:4px;font-weight:500;}
.summary-card .val{font-size:26px;font-weight:700;}
.summary-card .sub{font-size:11px;color:var(--text-muted);margin-top:3px;}
.c-blue{color:var(--primary);} .c-red{color:var(--danger);} .c-green{color:var(--success);}

.filter-bar{ background:var(--card); border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; box-shadow:var(--shadow-sm); border:1px solid var(--border-light); }
.search-box{position:relative;flex:1;min-width:200px;}
.search-box input{ width:100%; padding:7px 12px 7px 32px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12px; background:#f8fafc; outline:none; color:var(--text); }
.search-box input:focus{border-color:var(--primary);background:#fff;}
.search-box::before{ content:'🔍'; position:absolute; left:9px; top:50%; transform:translateY(-50%); font-size:11px; pointer-events:none; }
select{ padding:7px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12px; background:#f8fafc; cursor:pointer; outline:none; color:var(--text); }
select:focus{border-color:var(--primary);}

/* 図鑑カードグリッド */
.zukan-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; }
.zukan-card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border-light); overflow:hidden; cursor:pointer; transition:box-shadow .2s,transform .2s; display:flex; flex-direction:column; }
.zukan-card:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
.zukan-card-photo{ width:100%; aspect-ratio:4/3; background:linear-gradient(135deg,#eef2ff,#f4f6fb); display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--text-muted); overflow:hidden; }
.zukan-card-photo img{ width:100%; height:100%; object-fit:cover; }
.zukan-card-body{ padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; gap:6px; }
.zukan-card-title{ font-size:13.5px; font-weight:700; color:var(--text); line-height:1.3; }
.zukan-card-sub{ font-size:11px; color:var(--text-sub); }
.zukan-card-tags{ display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
.zukan-empty{ padding:60px 20px; text-align:center; color:var(--text-muted); }
.zukan-empty-icon{ font-size:36px; margin-bottom:10px; }

/* テンプレート案内バナー（フロー・マニュアル共通） */
.template-banner{ background:linear-gradient(135deg,#eef2ff,#f7f8ff); border:1px solid #dbe3ff; border-radius:var(--radius); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.template-banner-icon{ font-size:22px; flex-shrink:0; }
.template-banner-body{ flex:1; min-width:220px; }
.template-banner-title{ font-size:12.5px; font-weight:700; color:var(--text); }
.template-banner-sub{ font-size:11px; color:var(--text-sub); margin-top:2px; }
.template-banner-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.import-box{ background:var(--card); border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:10px 12px; margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.import-box input{ flex:1; min-width:220px; }

/* フロー詳細ページ（3ペイン） */
.flow-detail-header{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.flow-detail-header h2{ font-size:17px; font-weight:700; }
.flow-detail-grid{ display:grid; grid-template-columns:260px 1fr 280px; gap:16px; align-items:start; }
@media (max-width:1100px){ .flow-detail-grid{ grid-template-columns:1fr; } }

.flow-step-rail{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border-light); padding:8px; max-height:calc(100vh - 200px); overflow-y:auto; }
.flow-step-chip{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm); cursor:pointer; transition:background .15s; margin-bottom:2px; }
.flow-step-chip:hover{ background:var(--bg); }
.flow-step-chip.active{ background:var(--primary-light); }
.flow-step-chip-num{ width:24px; height:24px; border-radius:50%; background:#eef1f5; color:var(--text-sub); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.flow-step-chip.done .flow-step-chip-num{ background:var(--success); color:#fff; }
.flow-step-chip.branch .flow-step-chip-num{ background:var(--warning); color:#fff; border-radius:6px; }
.flow-step-chip-label{ font-size:12px; font-weight:600; color:var(--text); line-height:1.35; flex:1; }
.flow-step-chip.active .flow-step-chip-label{ color:var(--primary); }

.flow-detail-main{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border-light); padding:20px 22px; min-height:300px; }
.flow-detail-main-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.flow-detail-main-title{ font-size:16px; font-weight:700; }
.flow-detail-main-detail{ font-size:13px; line-height:1.9; white-space:pre-wrap; color:var(--text); margin-bottom:16px; }
.flow-branch-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
.flow-branch-box{ border-radius:var(--radius-sm); padding:12px 14px; font-size:12px; line-height:1.7; }
.flow-branch-box.yes{ background:#f0fdf4; border:1px solid #bbf7d0; }
.flow-branch-box.no{ background:#fef2f2; border:1px solid #fecaca; }
.flow-detail-manuals{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }

.flow-detail-side{ display:flex; flex-direction:column; gap:14px; }
.flow-side-card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border-light); padding:16px; }
.flow-side-card h4{ font-size:12px; font-weight:700; color:var(--text-sub); margin-bottom:10px; letter-spacing:.02em; }
.flow-side-card textarea{ width:100%; min-height:120px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12.5px; font-family:inherit; resize:vertical; }

/* 構造化ステップエディタ（フロー編集モーダル） */
.step-editor-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.step-editor-row{ border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:10px 12px; background:#fafbff; }
.step-editor-row-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.step-editor-row-head input[type=text]{ padding:5px 8px; font-size:12px; }
.step-editor-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.step-editor-grid textarea, .step-editor-grid input{ font-size:12px; padding:6px 8px; }

/* マニュアル・フロー リスト */
.kb-list{ display:flex; flex-direction:column; gap:10px; }
.kb-item{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); border:1px solid var(--border-light); padding:14px 16px; display:flex; align-items:flex-start; gap:12px; }
.kb-item-icon{ width:36px; height:36px; border-radius:8px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.kb-item-body{ flex:1; min-width:0; }
.kb-item-title{ font-size:13.5px; font-weight:700; color:var(--text); }
.kb-item-meta{ font-size:11px; color:var(--text-sub); margin-top:2px; }
.kb-item-summary{ font-size:12px; color:var(--text-sub); margin-top:6px; line-height:1.6; white-space:pre-wrap; }
.kb-item-actions{ display:flex; gap:6px; flex-shrink:0; }
.flow-steps{ font-size:12.5px; line-height:1.9; white-space:pre-wrap; background:#f8fafc; border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:10px 14px; margin-top:8px; }

.table-wrap{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-sm); overflow:visible; border:1px solid var(--border-light); }
.table-toolbar{ padding:12px 16px; border-bottom:1px solid var(--border-light); display:flex; align-items:center; justify-content:space-between; }
.table-toolbar h2{font-size:14px;font-weight:700;color:var(--text);}
table{width:100%; border-collapse:collapse;}
th{ padding:9px 12px; text-align:left; font-size:10.5px; font-weight:700; color:var(--text-sub); border-bottom:1px solid var(--border-light); background:#f8fafc; white-space:nowrap; }
td{ padding:10px 12px; border-bottom:1px solid var(--border-light); font-size:12.5px; vertical-align:middle; }
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8fafc;}
.editable-cell { position:relative; cursor:text; transition:background .15s; border:1px solid transparent; border-radius:4px; padding:6px 8px !important; }
.editable-cell:hover { background: rgba(37,99,235,0.05); border-color: rgba(37,99,235,0.3); }
.inline-edit-input { width:100%; box-sizing:border-box; padding:4px 6px; border:1px solid var(--primary); border-radius:4px; font-size:12px; font-family:inherit; outline:none; box-shadow:0 0 0 2px rgba(37,99,235,0.2); background:#fff; margin:-4px -6px; }

.badge{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:600; white-space:nowrap; }
.badge-default{background:#f1f5f9;color:#475569;}
.badge-success{background:#f0fdf4;color:#16a34a;}
.badge-info{background:#eff6ff;color:#2563eb;}
.badge-warning{background:#fffbeb;color:#d97706;}
.badge-danger{background:#fef2f2;color:#dc2626;}

.btn{ padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer; font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:5px; transition:all .15s; background:var(--card); color:var(--text); }
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:transparent;border:1px solid var(--border);}
.btn-outline.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-danger:hover{background:#b91c1c;}

/* Forms & Modals */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px;}
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.form-field label{font-size:11.5px;font-weight:600;color:var(--text);}
.form-field input,.form-field textarea,.form-field select{ padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12.5px; outline:none; color:var(--text); background:var(--card); transition:border .15s; font-family:inherit; }
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.08); }

.modal-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:400; align-items:center; justify-content:center; backdrop-filter:blur(2px); }
.modal-overlay.open{display:flex;}
.modal{ background:var(--card); border-radius:var(--radius-lg); max-width:640px; width:92%; max-height:90vh; overflow:auto; box-shadow:var(--shadow-lg); animation:modalIn .2s ease-out; }
@keyframes modalIn{ from{opacity:0;transform:scale(.96)translateY(8px);} to{opacity:1;transform:scale(1)translateY(0);} }
.modal-head{ padding:18px 22px 14px; border-bottom:1px solid var(--border-light); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--card); }
.modal-head h3{font-size:15px;font-weight:700;}
.modal-close{ background:none;border:none;font-size:18px; cursor:pointer;color:var(--text-sub); width:28px;height:28px; display:flex;align-items:center;justify-content:center; border-radius:6px; transition:background .15s; }
.modal-close:hover{background:var(--bg);}
.modal-body{padding:20px 22px;}
.modal-foot{ padding:14px 22px; border-top:1px solid var(--border-light); text-align:right; }

.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px;color:var(--text-sub);}
.spinner{ width:24px;height:24px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin{to{transform:rotate(360deg);}}

#toast{ position:fixed;bottom:24px;left:50%;transform:translateX(-50%); background:#1e293b;color:#fff;padding:10px 20px; border-radius:8px;font-size:13px;font-weight:500; opacity:0;transition:opacity .3s;z-index:9999; pointer-events:none;white-space:nowrap; box-shadow:var(--shadow-lg); }
#toast.show{opacity:1;}

.upload-area{ border:2px dashed var(--border); border-radius:var(--radius); padding:22px; text-align:center; cursor:pointer; transition:all .2s; background:#fafbff; }
.upload-area:hover,.upload-area.dragover{border-color:var(--primary);background:#f0f5ff;}

@media (max-width:900px){
  #sidebar{ position:fixed; left:0; top:0; }
  .zukan-grid{ grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); }
}
</style>
